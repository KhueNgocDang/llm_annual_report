[project]
name = "annual-report"
version = "0.1.0"
description = "Annual Report Intelligence Platform (rebuild)"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "beautifulsoup4>=4.14.3",
    "duckdb==1.5.4",
    "marimo>=0.12.0",
    "openai>=1.65.2,<2.0.0",
    "pandas>=2.2.3,<3.0.0",
    "plotly>=6.0.0",
    "python-dotenv>=1.1.1",
    "requests>=2.33.1",
    "tiktoken>=0.12.0",
    "ipykernel>=7.3.0",
]

[project.optional-dependencies]
full = [
    "awswrangler>=3.16.0",
    "google-api-python-client>=2.194.0",
    "google-auth-httplib2>=0.3.1",
    "google-auth-oauthlib>=1.3.1",
    "marker-pdf>=1.10.2",
    "pymupdf>=1.27.2.2",
]
